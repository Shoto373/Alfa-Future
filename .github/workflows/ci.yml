name: CI

# GitOps: CI только проверяет и публикует. На прод выкатывает агент на сервере (deploy/gitops),
# который сам забирает ветку `deploy`. Входа на сервер из GitHub нет.
#   PR в main      → тесты backend и frontend;
#   push в main    → тесты → образы в GHCR → коммит желаемого состояния в ветку `deploy`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Прогоны main идут строго по очереди: релизы попадают в `deploy` в порядке коммитов.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie
        env:
          POSTGRES_DB: alfa_test
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://alfa:alfa-ci@127.0.0.1:5432/alfa_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m unittest discover -s deploy/tests -v
          python -m pytest backend/tests -v

      - name: Architecture (layers, cycles, function size)
        if: always()
        working-directory: backend
        run: python tools/check_imports.py

      # Контракт 1.0.0: contracts/openapi.json совпадает со схемами сервера (docs/api-versioning.md).
      - name: API contract in sync
        if: always()
        working-directory: backend
        run: python tools/gen_contracts.py --check

      # Порог качества проверяет tests/test_golden_quality.py; здесь — читаемый отчет по golden set.
      - name: Quality report (golden set, rules)
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_SCHEMA: quality_report
          DATA_DIR: ../data/synthetic
          RUNTIME_DIR: ${{ runner.temp }}/runtime
          EMBEDDINGS_ENABLED: "0"
          RSS_SOURCES: ""
          RSS_REFRESH_MINUTES: "0"
        run: python -m app.eval_quality --set tests/golden --mode rules --out ../quality-rules.json --md ../quality-rules.md

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-rules.*
          if-no-files-found: ignore

      - name: Check deploy agent scripts
        run: |
          bash -n deploy/gitops/alfa-gitops
          bash -n deploy/gitops/install.sh

      # Ключи, .env, материалы кейса и реальные данные клиентов не должны попасть в репозиторий.
      - name: Repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|контекст/|phone1|\.(pem|key|docx|pdf)$'; then
            echo "::error::В репозитории файлы, которых там быть не должно (список выше)"; exit 1
          fi
          if git ls-files '*.csv' | grep -v '^data/synthetic/'; then
            echo "::error::CSV вне data/synthetic — реальные данные не коммитятся"; exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, typecheck, build
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code lib/api-types.ts || (echo "::error::lib/api-types.ts устарел: npm run gen:api"; exit 1)
          npm run lint
          npm run build
          npm run typecheck
      # Unit-тесты слоя данных, клиента API, сессии и компонентов разбора; покрытие lib/ ≥ 70% (vitest.config.mts).
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage
      # Бюджет главной: JS для «/» ≤ 200 КБ gzip (scripts/bundle-budget.mjs, по результатам сборки выше).
      - name: Bundle budget
        working-directory: frontend
        run: npm run budget

  # Интерфейс в настоящем браузере: сервис поднимается как у жюри (compose.yaml, без ключа LLM — правила),
  # e2e-тесты Playwright проходят сценарии; при падении — скриншоты и трассы артефактом.
  ui:
    needs: [frontend]
    # Playwright 1.56 ставит браузер и его системные библиотеки только на поддерживаемые версии Ubuntu:
    # ubuntu-latest уже 26.04, поэтому версия закреплена (обновить вместе с @playwright/test).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start service (compose.yaml)
        run: docker compose -f compose.yaml up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: UI tests
        working-directory: frontend
        run: |
          mkdir -p ../data/review/acceptance
          npx playwright test
      - name: Service logs
        if: failure()
        run: docker compose -f compose.yaml logs --tail=200 backend frontend
      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            frontend/test-results
            data/review/acceptance
          if-no-files-found: ignore

  images:
    if: github.repository == 'dvaJf/alfa' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ghcr.io/dvajf/alfa:backend-latest
            ghcr.io/dvajf/alfa:backend-${{ github.sha }}
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pointers-team.online
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ghcr.io/dvajf/alfa:frontend-latest
            ghcr.io/dvajf/alfa:frontend-${{ github.sha }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только push в ветку deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish desired state to branch "deploy"
        env:
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "alfa-ci"
          git config user.email "alfa-ci@users.noreply.github.com"

          out=$(mktemp -d)
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch -q origin deploy
            git worktree add -q "$out" origin/deploy
            git -C "$out" switch -q -C deploy
            # Более новый коммит main уже выкачен — старый релиз не перезаписывает его.
            current=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$out/release.json" 2>/dev/null || true)
            if [ -n "$current" ] && [ "$current" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$current" 2>/dev/null; then
              echo "deploy уже содержит более новый $current — пропуск"; exit 0
            fi
          else
            git worktree add -q --orphan -b deploy "$out"
          fi

          mkdir -p "$out/nginx"
          cp docker-compose.yml "$out/docker-compose.yml"
          cp nginx/nginx.conf "$out/nginx/nginx.conf"
          printf 'BACKEND_IMAGE=ghcr.io/dvajf/alfa:backend-%s\nFRONTEND_IMAGE=ghcr.io/dvajf/alfa:frontend-%s\n' "$SHA" "$SHA" > "$out/release.env"
          SUBJECT=$(git log -1 --format=%s "$SHA") AUTHOR=$(git log -1 --format=%an "$SHA") \
            python3 .github/scripts/release_json.py "$out/release.json"

          git -C "$out" add -A
          if git -C "$out" diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git -C "$out" commit -q -m "release ${SHA:0:7}: $(git log -1 --format=%s "$SHA")"
          git -C "$out" push -q origin HEAD:deploy
          echo "### Релиз ${SHA:0:7} опубликован в ветку deploy" >> "$GITHUB_STEP_SUMMARY"
