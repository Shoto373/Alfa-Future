name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    # Запускаем тесты для push, workflow_dispatch и активных либо смердженных PR
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-trixie
        env:
          POSTGRES_DB: alfa_test
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://alfa:alfa-ci@127.0.0.1:5432/alfa_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m unittest discover -s deploy/tests -v
          python -m pytest backend/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ghcr.io/dvajf/alfa:backend-latest
            ghcr.io/dvajf/alfa:backend-${{ github.sha }}
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pointers-team.online
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ghcr.io/dvajf/alfa:frontend-latest
            ghcr.io/dvajf/alfa:frontend-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          # Публичный ключ сервера (не секрет). Раньше его получал ssh-keyscan: он открывает 5 соединений
          # без входа, fail2ban на сервере (mode=aggressive, maxretry=3) считал их атакой и банил раннер.
          SERVER_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJS1KY1b/XISq4DWha1vg2cxjDf8qJq0XJXqXDLetwV4
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fingerprint proves which key GitHub actually hands to the runner.
          ssh-keygen -lf ~/.ssh/deploy_key
          printf '%s %s\n' "$HOST" "$SERVER_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Недоступный сервер — быстрая понятная ошибка вместо многоминутного зависания шага.
          printf 'Host *\n  ConnectTimeout 20\n  ServerAliveInterval 15\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload compose, nginx config + deploy script
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" 'mkdir -p ~/app/deploy ~/app/nginx'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            docker-compose.yml "$USER@$HOST:~/app/"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            nginx/nginx.conf "$USER@$HOST:~/app/nginx/"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/deploy.sh deploy/prepare_env.py "$USER@$HOST:~/app/deploy/"

      - name: Remote deploy
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          BACKEND_IMAGE: ghcr.io/dvajf/alfa:backend-${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/dvajf/alfa:frontend-${{ github.sha }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" \
            "cd ~/app && chmod +x deploy/deploy.sh && BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE ACTOR=$ACTOR GHCR_TOKEN=$GHCR_TOKEN bash deploy/deploy.sh"
