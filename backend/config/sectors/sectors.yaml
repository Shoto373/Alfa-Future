# Эталоны знака: валидатор проверяет, что по конфигурации событие дает именно такой эффект для отрасли.
# Перевернутый знак (чувствительности или направления темы) ломает эталон — такая версия не публикуется.
control_cases:
- {topic: key_rate, sector: construction, direction: up, expect: risk, why: рост ставки удорожает проектное финансирование}
- {topic: key_rate, sector: construction, direction: down, expect: opportunity, why: снижение ставки удешевляет финансирование стройки}
- {topic: key_rate, sector: auto, direction: up, expect: risk, why: дорогие автокредиты снижают продажи}
- {topic: fx, sector: mining_oil_gas, direction: up, expect: opportunity, why: слабый рубль — больше рублевой выручки экспортера}
- {topic: fx, sector: retail, direction: up, expect: risk, why: слабый рубль удорожает импортные товары}
- {topic: fx, sector: metallurgy, direction: down, expect: risk, why: крепкий рубль снижает рублевую выручку экспортера}
- {topic: fuel_oil, sector: transport, direction: up, expect: risk, why: топливо — главная статья затрат перевозчика}
- {topic: fuel_oil, sector: mining_oil_gas, direction: up, expect: opportunity, why: дорогая нефть — выручка добытчика}
- {topic: consumer_demand, sector: retail, direction: up, expect: opportunity, why: рост спроса — выручка ритейла}
- {topic: credit_market, sector: construction, direction: down, expect: risk, why: ужесточение кредита бьет по продажам стройки}
- {topic: labor, sector: hospitality, direction: up, expect: risk, why: рост зарплат давит на маржу трудоемкой отрасли}
- {topic: sanctions_geopolitics, sector: trade_wholesale, direction: up, expect: risk, why: новые ограничения ломают цепочки поставок}
- {topic: taxes_regulation, sector: mining_oil_gas, direction: up, expect: risk, why: рост НДПИ снижает маржу}
- {topic: metals_steel, sector: construction, direction: up, expect: risk, why: дорогой металл — рост себестоимости стройки}
- {topic: budget, sector: construction, direction: up, expect: opportunity, why: госрасходы — госзаказ для стройки}
