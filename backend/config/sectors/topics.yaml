# Темы новостей (SPR4-00): словари, смысловые описания, знак направления, формулировки эффекта,
# действия по ролям и уточняющий вопрос. up_means — что значит «up» для темы; direction_value.up > 0.
topics:
  key_rate:
    name: Ключевая ставка
    importance: 1.0
    stems:
    - ключев ставк
    - ставк цб
    - ставк банк росси
    - денежно-кредитн
    - дкп
    - совет директор банк росси
    - смягчени
    - ужесточени политик
    meanings:
    - Банк России принял решение по ключевой ставке
    - Центробанк сохранил, повысил или снизил стоимость денег в экономике
    - Денежно-кредитная политика регулятора и прогноз ставки
    up_means: ставка повышается
    direction_value:
      up: 1
      hold: 0.6
      down: -1
    effect:
      risk: обслуживание долга и новые заимствования остаются дорогими
      opportunity: доходность размещения свободной ликвидности остается высокой
    effect_down:
      risk: доходность нового размещения ликвидности может снизиться
      opportunity: стоимость новых заимствований может снизиться; эффект для действующего долга зависит от договоров
    actions:
      cfo:
      - text: Пересчитать график обслуживания долга при текущих условиях финансирования и проверить запас по ковенантам
        needs: loans
      - text: Сравнить плавающую и фиксированную ставку для новых траншей; оценить хеджирование части долга
        needs: loans
      - text: Пересчитать стоимость лизинговых платежей и сравнить с покупкой оборудования за собственные средства
        needs: leasing
      - text: Сравнить варианты размещения свободной ликвидности с учетом текущих ставок и сроков
        needs: deposits
      - text: Оценить, выгодно ли сейчас привлекать заемное финансирование или отложить проекты до снижения ставки
      treasurer:
      - text: Разместить временно свободную ликвидность на срок до конца года, пока ставки высоки
      - text: Проверить лимиты и стоимость кредитных линий на ближайший период
        needs: loans
      ceo:
      - text: Пересмотреть сроки инвестпроектов, финансируемых заемными средствами
        needs: loans
      - text: Сопоставить план инвестиций со сценариями изменения стоимости финансирования
      owner:
      - text: Оценить долговую нагрузку при текущих условиях финансирования
        needs: loans
      - text: Решить, направлять ли свободный денежный поток на депозиты или в развитие
      default:
      - text: Оценить чувствительность денежного потока к сохранению ставки на текущем уровне
    question: Какая доля долга компании привязана к плавающей ставке и когда ближайшие погашения?
  inflation:
    name: Инфляция
    importance: 0.8
    stems:
    - инфляц
    - дефляц
    - рост цен
    - индекс потребительск
    - инфляционн ожидан
    - подорожа
    meanings:
    - Инфляция в России ускорилась или замедлилась
    - Потребительские цены выросли за неделю или месяц
    - Росстат зафиксировал изменение цен на товары и услуги
    up_means: цены растут быстрее
    direction_value:
      up: 1
      hold: 0.3
      down: -1
    effect:
      risk: издержки растут быстрее, чем их удается переложить в цены
      opportunity: номинальная выручка растет вместе с ценами
    effect_down:
      risk: темп роста цен реализации замедляется
      opportunity: давление роста издержек может ослабнуть
    actions:
      cfo:
      - text: Обновить бюджет с учетом прогноза инфляции банка и проверить индексацию в договорах
      ceo:
      - text: Пересмотреть ценовую политику и условия индексации с ключевыми покупателями
      accountant:
      - text: Проверить условия индексации цен и авансов в договорах с поставщиками
      default:
      - text: Оценить, какую часть роста издержек можно переложить в цены
    question: Есть ли в договорах механизмы индексации цен?
