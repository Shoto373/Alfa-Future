    effect_down:
      risk: валютная выручка дает меньше рублей при укреплении рубля
      opportunity: валютные закупки могут стать дешевле в рублях
    actions:
      treasurer:
      - text: Сопоставить валютную позицию с прогнозом курса банка и решить, какую часть закупок захеджировать
      cfo:
      - text: Оценить влияние курса на маржу по импортным закупкам и валютной выручке
      accountant:
      - text: Проверить валюту и сроки расчетов по внешнеторговым контрактам
      default:
      - text: Оценить валютные риски по контрактам с иностранными контрагентами
    question: Какая доля закупок и выручки номинирована в валюте и в какой именно?
