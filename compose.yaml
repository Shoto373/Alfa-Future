services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
      DATA_DIR: /data/case
      RUNTIME_DIR: /app/runtime
      BANK_PDF_DIR: /data/bank_pdf
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      ANALYSIS_TIMEOUT_SECONDS: "150"
    volumes:
      # Реальные CSV кейса: CASE_DATA_DIR=./контекст/data docker compose up (по умолчанию — синтетика)
      - ${CASE_DATA_DIR:-./data/synthetic}:/data/case:ro
      - ${BANK_PDF_HOST_DIR:-./data/materials/an}:/data/bank_pdf:ro
      - runtime:/app/runtime
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      TEST_DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  runtime:
  postgres_data:
