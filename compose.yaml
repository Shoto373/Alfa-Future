services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data/case
      RUNTIME_DIR: /app/runtime
      BANK_PDF_DIR: /data/bank_pdf
      FRONTEND_ORIGIN: http://localhost:3000
      ANALYSIS_TIMEOUT_SECONDS: "90"
    volumes:
      # Реальные CSV кейса: CASE_DATA_DIR=./контекст/data docker compose up (по умолчанию — синтетика)
      - ${CASE_DATA_DIR:-./data/synthetic}:/data/case:ro
      - ${BANK_PDF_HOST_DIR:-./data/bank_pdf}:/data/bank_pdf:ro
      - runtime:/app/runtime
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  runtime:
