services:
  postgres:
    # PostgreSQL 17 + pgvector (векторное хранилище). Тот же Debian trixie, что у postgres:17.6.
    image: pgvector/pgvector:0.8.1-pg17-trixie
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    # Только кэш (лента, служебные значения): без сохранения на диск, вытеснение LRU.
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
      DATA_DIR: /data/case
      RUNTIME_DIR: /app/runtime
      BANK_PDF_DIR: /data/bank_pdf
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      ANALYSIS_TIMEOUT_SECONDS: "150"
      REDIS_URL: redis://redis:6379/0
      # Локальная проверка: демо-сотрудник банка видит метрики, расходы и аудит (/metrics, /audit).
      # Только для локального запуска — в production (docker-compose.yml) значения по умолчанию нет.
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-operator@alfa.test}
      # Готовые учетные записи для проверки (demo@alfa.test, demo-ceo@alfa.test, operator@alfa.test).
      # Пароль известен всем — поэтому только локально; в docker-compose.yml этих переменных нет.
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-alfa-demo-2026}
    volumes:
      # Реальные CSV кейса: CASE_DATA_DIR=./контекст/data docker compose up (по умолчанию — синтетика)
      - ${CASE_DATA_DIR:-./data/synthetic}:/data/case:ro
      - ${BANK_PDF_HOST_DIR:-./data/materials/an}:/data/bank_pdf:ro
      - runtime:/app/runtime
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 3
      # При старте прогреваются модель, векторы, новости и ленты — первый запуск дольше.
      start_period: 300s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      TEST_DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  runtime:
  postgres_data:
