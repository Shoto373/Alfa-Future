services:
  postgres:
    # PostgreSQL 17 + pgvector (векторное хранилище). Тот же Debian trixie, что у postgres:17.6.
    image: pgvector/pgvector:0.8.1-pg17-trixie
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    # Только кэш (лента, служебные значения): без сохранения на диск, вытеснение LRU.
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Два экземпляра API за nginx (сервис nginx ниже), фоновые задачи — отдельный worker (SPR3-01).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alfa-backend
    deploy:
      replicas: ${API_REPLICAS:-2}
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      ROLE: api
      DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
      DATA_DIR: /data/case
      RUNTIME_DIR: /app/runtime
      BANK_PDF_DIR: /data/bank_pdf
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      ANALYSIS_TIMEOUT_SECONDS: "150"
      REDIS_URL: redis://redis:6379/0
      # Заглушка лицензированных лент Интерфакс/ПРАЙМ (SPR3-02): демо-новости о компаниях профилей
      # и их контрагентах. Реальные ленты подключаются только по договору — в docker-compose.yml ее нет.
      LICENSED_FEED_DIR: ${LICENSED_FEED_DIR-/app/app/news/sources/demo}
      # Локальная проверка: демо-сотрудник банка видит метрики, расходы и аудит (/metrics, /audit).
      # Только для локального запуска — в production (docker-compose.yml) значения по умолчанию нет.
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-operator@alfa.test}
      # Готовые учетные записи для проверки (demo@alfa.test, demo-ceo@alfa.test, operator@alfa.test).
      # Пароль известен всем — поэтому только локально; в docker-compose.yml этих переменных нет.
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-alfa-demo-2026}
      # Вход через Альфа-ID (OIDC): локально — Keycloak из профиля auth (make up-auth); пусто — выключен.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-}
      OIDC_REDIRECT_URI: http://localhost:${API_PORT:-8000}/api/v1/auth/oidc/callback
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-1}
    volumes: &backend-volumes
      # Реальные CSV кейса: CASE_DATA_DIR=./контекст/data docker compose up (по умолчанию — синтетика)
      - ${CASE_DATA_DIR:-./data/synthetic}:/data/case:ro
      - ${BANK_PDF_HOST_DIR:-./data/materials/an}:/data/bank_pdf:ro
      - runtime:/app/runtime
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 3s
      retries: 3
      # При старте прогреваются модель, векторы, новости и ленты — первый запуск дольше.
      start_period: 300s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Фоновый воркер: сбор новостей, предрасчет разборов, переклассификация, очистка резервов LLM.
  # Остановка воркера не мешает API: новости просто не обновляются, пока он не запущен снова.
  worker:
    image: alfa-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      ROLE: worker
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker.runner import healthy; raise SystemExit(0 if healthy() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  # Вход в API для браузера и интерфейса: распределяет запросы по экземплярам backend.
  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Демо-IdP (OIDC) вместо Альфа-ID: реалм alfa, клиент alfa-pulse (PKCE), пилотные пользователи
  # pilot@alfa.test и pilot-ceo@alfa.test (пароль alfa-demo-2026, компания U_9). Профиль auth: make up-auth.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-alfa-demo-2026}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak/realm-alfa.json:/opt/keycloak/data/import/realm-alfa.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      TEST_DATABASE_URL: ""
      PGHOST: postgres
      PGDATABASE: alfa
      PGUSER: alfa
      PGPASSWORD: ${POSTGRES_PASSWORD:-alfa-local}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  runtime:
  postgres_data:
