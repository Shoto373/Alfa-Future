openapi: 3.1.0
info:
  title: Alfa Pulse Monolith Backend
  version: 0.1.0
  description: |
    Публичный контракт спринта 1. Все данные синтетические, LLM не вызывается.
    Схемы тел описаны в schemas/common.json.
paths:
  /healthz:
    get:
      summary: Проверка готовности backend
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: "./schemas/common.json#/$defs/Healthz"
  /api/v1/companies:
    get:
      summary: Список синтетических профилей компаний
      responses:
        "200":
          description: Список компаний
          content:
            application/json:
              schema:
                $ref: "./schemas/common.json#/$defs/CompanyList"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/insights:
    post:
      summary: Синхронный анализ события для компании и роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/common.json#/$defs/InsightRequest"
            example:
              company_id: demo_company_001
              role: cfo
              event_id: demo_event_001
      responses:
        "200":
          description: Тестовая карточка инсайта
          content:
            application/json:
              schema:
                $ref: "./schemas/common.json#/$defs/Insight"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: |
        Ошибка. Коды: 400 INVALID_REQUEST, 404 COMPANY_NOT_FOUND | EVENT_NOT_FOUND,
        413 REQUEST_TOO_LARGE, 500 INTERNAL_ERROR | INVALID_ANALYSIS_RESULT,
        503 ANALYSIS_UNAVAILABLE, 504 ANALYSIS_TIMEOUT. retryable=true только для 503/504.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.json#/$defs/ErrorResponse"
