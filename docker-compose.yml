version: '3.8'
services:
  app:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - app-network
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
