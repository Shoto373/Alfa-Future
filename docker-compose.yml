services:
  app:
    build: .
    image: ${IMAGE:-fastapi_app:latest}
    container_name: alfa-app
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: alfa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
