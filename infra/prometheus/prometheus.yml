# Prometheus (профиль monitoring, SPR3-05): каждый экземпляр API по DNS сервиса backend.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: alfa-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 30s
