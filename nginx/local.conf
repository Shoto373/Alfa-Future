# Локальный запуск (compose.yaml): nginx перед несколькими экземплярами API (SPR3-01).
# Интерфейс обращается к API по http://localhost:${API_PORT:-8000} — это этот nginx.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    keepalive_timeout 65;
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/plain;

    # Docker DNS: имя backend возвращает адреса всех реплик; nginx перерезолвит его каждые 5 с
    # и распределяет запросы по кругу. Упавший экземпляр (ошибка соединения, 502/503/504)
    # пропускается: запрос уходит на следующий — пассивная проверка здоровья.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        client_max_body_size 21m;  # PDF аналитики до 20 МБ; точный лимит каждого адреса проверяет backend (413)

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        location / {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_read_timeout 180s;  # разбор с LLM может занимать до ~2 минут
        }
    }
}
