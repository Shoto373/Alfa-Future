worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Сжатие: лента компании — ~300 КБ JSON, без gzip она заметно медленнее грузится из России до сервера.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # Ответ API целиком в памяти, без временного файла на диске.
    proxy_buffer_size 16k;
    proxy_buffers 64 16k;
    proxy_busy_buffers_size 64k;

    # Docker DNS: имена контейнеров резолвятся при каждом запросе,
    # поэтому nginx переживает пересоздание backend/frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name pointers-team.online www.pointers-team.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name pointers-team.online www.pointers-team.online;

        ssl_certificate /etc/letsencrypt/live/pointers-team.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pointers-team.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Лимит тела проверяет сам backend (413 REQUEST_TOO_LARGE в формате контракта).
        client_max_body_size 1m;

        # FastAPI: API, healthcheck и документация.
        location ~ ^/(api/|healthz$|docs|redoc|openapi\.json$) {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_read_timeout 180s;  # разбор с LLM может занимать до ~2 минут
        }

        # Next.js: все остальное.
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
        }
    }
}
